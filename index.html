<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N5 Clara · A tua assistente comercial</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="N5 Clara" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:url" content="https://clara.numerocinco.pt/" />
    <meta property="og:title" content="N5 Clara · A assistente comercial do consultor imobiliário" />
    <meta property="og:description" content="Responde às tuas leads em minutos, organiza o teu dia e diz-te como fechar. Lançamento a 1 de dezembro: a lista de espera já está aberta." />
    <meta property="og:image" content="https://clara.numerocinco.pt/partilha/clara-capa.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Uma assistente que responde às tuas leads, organiza o teu dia e te diz como fechar. N5 Clara, lançamento a 1 de dezembro." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://clara.numerocinco.pt/partilha/clara-capa.png" />
    <meta name="description" content="A Clara responde às tuas leads, organiza o teu dia e mostra-te onde perdes tempo e negócios. Lançamento a 1 de dezembro. Entra na lista de espera." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- formulário escondido para o Netlify Forms detetar os campos no build -->
    <form name="lista-clara" data-netlify="true" netlify-honeypot="empresa-site" hidden>
      <input name="nome" /><input name="email" /><input name="telefone" />
      <input name="agencia" /><input name="plano" /><input name="indicado_por" /><input name="consentimento" />
      <input name="codigo" /><input name="indicado_codigo" />
      <input name="origem" /><input name="diagnostico" />
      <input name="meta_evento" /><input name="meta_consentimento" /><input name="meta_fbp" /><input name="meta_fbc" />
      <input name="empresa-site" />
    </form>
    <form name="lista-espera" data-netlify="true" netlify-honeypot="empresa-site" hidden>
      <input name="nome" /><input name="email" /><input name="telefone" />
      <input name="agencia" /><input name="plano" /><input name="indicado_por" /><input name="consentimento" />
      <input name="codigo" /><input name="indicado_codigo" />
      <input name="origem" /><input name="diagnostico" />
      <input name="meta_evento" /><input name="meta_consentimento" /><input name="meta_fbp" /><input name="meta_fbc" />
      <input name="empresa-site" />
    </form>
    <!-- respostas do diagnóstico sem nome nem contacto, para sabermos como trabalham os consultores -->
    <form name="diagnostico" data-netlify="true" netlify-honeypot="empresa-site" hidden>
      <input name="respostas" /><input name="origem" /><input name="empresa-site" />
    </form>
    <form name="prioridades" data-netlify="true" netlify-honeypot="empresa-site" hidden>
      <input name="email" /><input name="prioridades" /><input name="empresa-site" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
